
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5c928">
  <title>Compras Santa Rita</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="logo">🛒</div>
    <h1>Compras Santa Rita</h1>
    <p>Sistema de Gestão de Compras</p>
  </header>

  <main class="container">

    <section class="login-card">
      <h2>Bem-vindo!</h2>
      <p>Entre com seu e-mail e senha para acessar o sistema.</p>

      <form id="login-form">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >

        <button type="submit">ENTRAR</button>
        <p id="mensagem"></p>
      </form>
    </section>

  </main>

  <footer>
    <p>Desenvolvido por <strong>Michael Vaz</strong></p>
    <span>Supermercado Santa Rita</span>
  </footer>

  <script type="module" src="app.js"></script>

</body>
</html>
